<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up PUBG Mobile</title>
    <link rel="stylesheet" href="stylegame.css">

</head>
<body>
    <div class="header">
        <img src="img/pubg.jpg" alt="PUBG Mobile">
        <h1>Top Up UC PUBG Mobile</h1>

        <div class="topup-item">
            <img src="img/uc1.jpg" alt="UC">

        </div>
        <div class="topup-item">
            <img src="img/uc2.jpg" alt="UC">
            <h3>325 UC</h3>
            <p>Rp 50,000</p>
            <button>Beli</button>
        </div>
        <div class="topup-item">
            <img src="img/uc3.jpg" alt="UC">
            <h3>660 UC</h3>
            <p>Rp 100,000</p>
            <button>Beli</button>
        </div>
        <div class="topup-item">
            <img src="img/uc4.jpg" alt="UC">
            <h3>1800 UC</h3>
            <p>Rp 250,000</p>
            <button>Beli</button>
        </div>
    </div>
    <a href="index.html" class="back-link">Kembali ke list Top up Game</a>

</html>
